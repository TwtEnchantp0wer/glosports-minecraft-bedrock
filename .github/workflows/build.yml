name: build

# Builds the port zip without needing Docker locally:
# GitHub Actions -> run -> download the "minecraft-bedrock-port" artifact.
#
# The first Dockerfile stage compiles mcpelauncher-client for ARMv7 inside an
# armhf container, which runs through QEMU on the amd64 runner. That stage is
# the slow part (roughly 1-3 h); the GHA cache makes later builds much faster.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (armhf build stage)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm

      - uses: docker/setup-buildx-action@v3

      - name: Build port zip
        run: |
          docker buildx build \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --output type=local,dest=./out .

      - uses: actions/upload-artifact@v4
        with:
          name: minecraft-bedrock-port
          path: out/minecraft-bedrock-port.zip
          if-no-files-found: error
